apiVersion: apps/v1
kind: Deployment
metadata:
  name: dapper
  namespace: dapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dapper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dapper
    spec:
      containers:
        - name: dapper
          image: ghcr.io/dmonlineuk/dapper:0.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: dapper-config
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dapper
  namespace: dapper
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dapper
  ports:
    - name: http
      port: 8000
      targetPort: http
