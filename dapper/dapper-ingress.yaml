apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dapper-lan-only
  namespace: dapper
spec:
  ipAllowList:
    sourceRange:
      - 192.168.1.0/24
      - 192.168.2.0/24
      - 192.168.99.0/24
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dapper
  namespace: dapper
spec:
  ingressClassName: traefik
  rules:
    - host: dapper.loc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dapper
                port:
                  number: 8000
